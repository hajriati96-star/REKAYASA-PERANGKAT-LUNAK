{% extends 'base.html' %}
{% block title %}Hapus Alat{% endblock %}
{% block content %}
<div class="card p-4">
    <h4>Konfirmasi Hapus</h4>
    <p>Apakah Anda yakin ingin menghapus alat <strong>{{ alat.nama_alat }} ({{ alat.nomor_inventaris }})</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, Hapus</button>
        <a href="{% url 'alat:detail' alat.pk %}" class="btn btn-outline-secondary">Batal</a>
    </form>
</div>
{% endblock %}
